modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Luminiflux's MTR Expansion Pack (流光MTR拓展包)"
authors="${mod_authors}"
description='''${mod_description}

v1.0 feature: Visual Rail Placement Preview.
Hold an MTR rail connector with an anchor node selected and aim at another
node: LMEP draws a live ghost track and shows the rail length in real time,
exactly matching the geometry MTR is about to build.

Client-side only addon. It does not modify or patch Minecraft Transit Railway.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="CLIENT"

# MTR 3.x only. The upper bound deliberately excludes MTR 4.x, whose internals
# (org.mtr.mod.*) are incompatible with the mtr.* API this addon is built on.
[[dependencies.${mod_id}]]
modId="mtr"
mandatory=true
versionRange="[1.20.1-3.2.2-hotfix-2,1.20.1-4)"
ordering="AFTER"
side="CLIENT"
