# ============================================================================
#  LMEP - Luminiflux's MTR Expansion Pack (流光MTR拓展包)
#  Target: Minecraft 1.20.1 + Forge 47.x + Minecraft Transit Railway 3.2.2
# ============================================================================

# --- Minecraft / Forge ------------------------------------------------------
minecraft_version=1.20.1
forge_version=47.2.0

# --- LMEP itself ------------------------------------------------------------
mod_id=lmep
mod_name=Luminiflux's MTR Expansion Pack
# 1.0.0-hotfix-1: the HUD panel is no longer permanently on screen (it now appears only
# while a rail connector is held) and it moved from the top-right to the bottom-left.
# Base version deliberately unchanged; the hotfix marker follows MTR's own convention.
mod_version=1.0.0-hotfix-1
mod_license=MIT
mod_authors=Luminiflux
mod_description=A client-side addon that ports the MTR4-style visual rail placement preview into MTR3: while you connect two rail nodes, LMEP draws a live ghost track and shows its length, XYZ offset, slope and radius in real time.

# --- MTR dependency ---------------------------------------------------------
# Minecraft Transit Railway 3.x, Forge build for 1.20.1.
# The published jar is SRG-named, so build.gradle wraps it in fg.deobf().
mtr_version=1.20.1-3.2.2-hotfix-2
architectury_version=9.2.14
